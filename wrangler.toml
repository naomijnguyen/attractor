name = "attractor"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# KV namespace holding attractor:state and attractor:history.
# Create with:  wrangler kv namespace create MODEL_KV
[[kv_namespaces]]
binding = "MODEL_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# Queue used by POST /api/attractor/trigger to enqueue background updates.
# Create with:  wrangler queues create attractor-jobs
[[queues.producers]]
binding = "JOBS"
queue = "attractor-jobs"

# ANTHROPIC_API_KEY is a secret, never a var. Set it with:
#   wrangler secret put ANTHROPIC_API_KEY

[vars]
# Whose engagement this attractor models. Appears in the update prompt and in
# the system-prompt context block. Defaults to "the user" if unset.
ATTRACTOR_SUBJECT = "the user"

# ATTRACTOR_TOKEN is a secret, never a var. Every route requires it:
#   wrangler secret put ATTRACTOR_TOKEN

# Model overrides. Both default to the values in src/engine.ts if unset.
# ATTRACTOR_SUMMARY_MODEL = "claude-haiku-4-5-20251001"
# ATTRACTOR_UPDATE_MODEL  = "claude-opus-5"
